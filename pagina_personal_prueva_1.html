<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>datos pesonales </title>
</head>
<body>
    <center>
        <h1>Formulario de Registro</h1>
        <h2><p>Por favor, completa el siguiente formulario con tus datos personales.</p></h2>
    </center>

    <fieldset><legend>Introduce tus datos personales</legend>
       
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required>
        <br>
        <label for="apellido_materno">Apellido Materno:</label>
        <input type="text" id="apellido_materno" name="apellido_materno" required>
        <br>
        <label for="apellido_paterno">Apellido Paterno:</label>
        <input type="text" id="apellido_paterno" name="apellido_paterno" required>
        <br>
        <label for="fecha_nacimiento">Fecha de Nacimiento:</label>
        <input type="date" id="fecha_nacimiento" name="fecha_nacimiento">
        <br>
        <label for="genero">Género:</label>
        <select id="genero" name="genero">
            <option value="masculino">Masculino</option>
            <option value="femenino">Femenino</option>
        </select>
        <br>
        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" name="telefono" pattern="[0-9]{10}" required>
        <br>
        <label for="direccion">Dirección:</label>
        <input type="text" id="direccion" name="direccion">
        <br>
        <label for="ciudad">Ciudad:</label>
        <input type="text" id="ciudad" name="ciudad" required>
        
        <br>
        <label for="estado">Estado:</label>
        <input type="text" id="estado" name="estado" required>
        <br>
    </fieldset>
    <br>
    <fieldset><legend>Datos Residenciales</legend>
       
        <label>zona:</label>
        <input type="radio" id="urbana" name="zona" value="urbana">
        <label for="urbana">Urbana</label>
        <input type="radio" id="rural" name="zona" value="rural">
        <label for="rural">Rural</label>
        <br>
        <label for="departamento">departamento </label>
        <input type="text" id="departamento" name="departamento" required>
        <br>
        <label for="ib_muncipio">ingrese tu municipio</label>
        <input type="text" id="ib_muncipio" name="ib_muncipio" required>
        <br>
        <label for="direccion">direccion:</label>
        <input type="text" id="direccion" name="direccion" required>
        <br>
        <label for="medio de trasporte">medio de trasporte:</label>
        <select id="medio_de_trasporte" name="medio_de_trasporte">
            <option value="carro">Carro</option>
            <option value="moto">Moto</option>
            <option value="bicicleta">Bicicleta</option>
            <option value="transporte_publico">Transporte Público</option>
            <option value="a pie">A Pie</option>
        </select>
        <br>
        <label for="ocupacion">Ocupación:</label>
        <select id="ocupacion" name="ocupacion">
            <option value="estudiante">Estudiante</option>
            <option value="empleado">Empleado</option>
            <option value="desempleado">Desempleado</option>
            <option value="profesional">Profesional</option>
            <option value="otro">Otro</option>
        </select>
        <br>
        <label for="¿tienes internet?">¿tienes internet?:</label>
        <select id="tienes_internet" name="tienes_internet">
            <option value="si">Sí</option>
            <option value="no">No</option>
        </select>
        <br>
        <label for="¿tienes computadora?">¿tienes computadora?:</label>
        <select id="tienes_computadora" name="tienes_computadora">
            <option value="si">Sí</option>
            <option value="no">No</option>
        </select>
        <br>
        <label for="¿recibes remesas?">¿recibes remesas?:</label>
        <select id="recibes_remesas" name="recibes_remesas">
            <option value="si">Sí</option>
            <option value="no">No</option>
        </select>
        <br>
        <label for="¿el estudiante tiene hijos?">¿el estudiante tiene hijos?:</label>
        <select id="tiene_hijos" name="tiene_hijos">
            <option value="si">Sí</option>
            <option value="no">No</option>
        </select>
        <br>
        <label for="¿tiene alguna discapacidad?">¿tiene alguna discapacidad?:</label>
        <select id="tiene_discapacidad" name="tiene_discapacidad">
            <option value="si">Sí</option>
            <option value="no">No</option>
        </select>
        <br>
        <label for="¿cuantos dormitorios tiene tu casa?">¿cuántos dormitorios tiene tu casa?:</label>
        <input type="number" id="num_dormitorios" name="num_dormitorios" min="1" max="10" required>
        <br>
    
    <br><br>
    <input type="submit" value="Enviar">
    <input type="reset" value="Limpiar">
    </fieldset>
    <br>
    <input type="submit" value="Volver" class="bt" onclick="location.href='ejemplo.html'">
</body>
</html>
