<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etapas de la vida</title>
</head>
<body>
    <script>
        let Edad = prompt("¿Cuál es tu edad?");
         if (Edad >=0 && Edad < 12) {
            alert("¡Estas en la etapa de la niñes disfruta de tu infancia!");
            //window.location.href = "https://www.google.com";
        } else if (Edad >= 12 && Edad < 18) {
            alert("¡Estas en la etapa de la adolecencia!");
        } else if (Edad > 18 && Edad < 25) {
            alert("¡Estas en la etapa de la joventud!");
        } else if (Edad >= 25 && Edad < 60) {
            alert("¡Estas en la etapas de la adulto!");
        } else if (Edad >= 60 && Edad < 100) {
            alert("¡Estas en la etapa de la adulto mayor!");
            //window.location.href = "https://www.google.com";
        } else if (Edad >= 100) {
            alert("¡Como has vivido tanto tiempo eres un focil o que!");
        } else {
            alert("¡Edad no válida! Por favor, introduce un número válido.");
        }
        
    </script>
</body>
</html>
