<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Carrusel de Imágenes de Internet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Enlace a Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Enlace a Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

  <div class="carousel-container bg-white p-6 rounded-3xl shadow-lg w-full">
    <h2 class="text-center text-4xl font-extrabold text-gray-800 mb-8">Galería de Imágenes Increíbles</h2>

    <div id="miCarrusel" class="carousel slide relative" data-bs-ride="carousel">

      <div class="carousel-indicators absolute bottom-0 left-0 right-0 flex justify-center p-0 mb-4">
        <button type="button" data-bs-target="#miCarrusel" data-bs-slide-to="0" class="active w-3 h-3 rounded-full bg-white mx-1" aria-current="true" aria-label="Slide 1"></button>
        <button type="button" data-bs-target="#miCarrusel" data-bs-slide-to="1" class="w-3 h-3 rounded-full bg-white mx-1" aria-label="Slide 2"></button>
        <button type="button" data-bs-target="#miCarrusel" data-bs-slide-to="2" class="w-3 h-3 rounded-full bg-white mx-1" aria-label="Slide 3"></button>
      </div>
      <div class="carousel-inner rounded-2xl">
        <div class="carousel-item active">
          <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" class="d-block w-full rounded-2xl" alt="Paisaje de Montaña">
          <div class="carousel-caption hidden md:block text-white bg-black bg-opacity-50 rounded-b-xl p-3">
          </div>
        </div>
        <div class="carousel-item">
          <img src="https://i.pinimg.com/originals/dc/de/eb/dcdeeb0b0074bbe4d53f2f8bdc8f7631.jpg" class="d-block w-full rounded-2xl" alt="Ciudad al Atardecer">
          <div class="carousel-caption hidden md:block text-white bg-black bg-opacity-50 rounded-b-xl p-3">
          </div>
        </div>
      </div>
      <button class="carousel-control-prev absolute top-1/2 left-0 transform -translate-y-1/2 p-4 text-white hover:bg-black hover:bg-opacity-75 rounded-full transition-all duration-300" type="button" data-bs-target="#miCarrusel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon inline-block w-8 h-8 bg-no-repeat bg-center" aria-hidden="true"></span>
        <span class="visually-hidden">Anterior</span>
      </button>
      <button class="carousel-control-next absolute top-1/2 right-0 transform -translate-y-1/2 p-4 text-white hover:bg-black hover:bg-opacity-75 rounded-full transition-all duration-300" type="button" data-bs-target="#miCarrusel" data-bs-slide="next">
        <span class="carousel-control-next-icon inline-block w-8 h-8 bg-no-repeat bg-center" aria-hidden="true"></span>
        <span class="visually-hidden">Siguiente</span>
      </button>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
